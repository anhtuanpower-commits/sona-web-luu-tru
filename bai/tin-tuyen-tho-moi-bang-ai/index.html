:root{

/* ---------- nền tảng ---------- */

/* ---------- menu (10.3) ---------- */

async function load(){
  try{[SITE,PRODUCTS]=await Promise.all([fetch("site.json").then(r=>r.json()),fetch("products.json").then(r=>r.json())])}catch(e){SITE={};PRODUCTS=[]}

  const dv=SVCS().map(p=>`<a href="${linkOf(p)}">${esc(p.ten)}</a>`).join("");
  $("#dvMenu").innerHTML=dv+`<a href="#dich-vu" class="tat-ca">Tất cả dịch vụ →</a>`;$("#dvSub").innerHTML=dv;
  $("#foot").textContent=SITE.chan_trang||"© "+new Date().getFullYear()+" "+name+" · "+(SITE.seo?.dia_chi_web||"").replace(/^https:\/\/|\/$/g,"");
  $("#fSp").innerHTML=[...APPS(),...SVCS()].map(p=>`<a href="${linkOf(p)}">${esc(p.ten)}</a>`).join("");
  $("#flinks").innerHTML=[["#tai-lieu","Tài liệu & Ebook"],["#hoc","Học miễn phí"],["#doi-tac","Đối tác"],["#gioi-thieu","Giới thiệu"],["#lien-he","Liên hệ"]].map(([h,t])=>`<a href="${h}">${t}</a>`).join("")+PAGES.filter(x=>x.hien_chan_trang).map(x=>`<a href="#trang/${esc(x.slug)}">${esc(x.tieu_de)}</a>`).join("");
  const S=SITE.mang_xa_hoi||{};const okU=u=>/^https:\/\//.test(u||"");
  $("#fsoc").innerHTML=[zaloUrl()&&`<a href="${zaloUrl()}" target="_blank" rel="noopener">Zalo ${esc(zaloShow())}</a>`,SITE.hotline&&`<a href="tel:${esc(SITE.hotline.replace(/[^\d+]/g,""))}">Hotline ${esc(SITE.hotline)}</a>`,
    okU(S.facebook)&&`<a href="${esc(S.facebook)}" target="_blank" rel="noopener">Facebook</a>`,okU(S.tiktok)&&`<a href="${esc(S.tiktok)}" target="_blank" rel="noopener">TikTok</a>`,okU(S.youtube)&&`<a href="${esc(S.youtube)}" target="_blank" rel="noopener">YouTube</a>`].filter(Boolean).join("");
  route()}
function route(){const h=location.hash||(window.SONA_ROUTE?"#"+window.SONA_ROUTE:"");closeMenu();
  const pm=h.match(/^#trang\/([\w-]+)/);const pg=pm&&PAGES.find(x=>x.slug===pm[1]);
  const m=h.match(/^#(?:sp|dich-vu)\/([\w-]+)/);const p=m&&PRODUCTS.find(x=>x.slug===m[1]);
  const b=h.match(/^#bai\/([\w-]+)/);const a=b&&POSTS.find(x=>x.slug===b[1]);
  const t=h.match(/^#hoc\/(.+)$/);const hoc=/^#hoc/.test(h)||!!a;
  const is=re=>re.test(h);
  const svc=is(/^#dich-vu/)||(p&&isSvc(p)),app=!svc&&(is(/^#(app|san-pham)/)||(p&&isApp(p))),tl=is(/^#tai-lieu/)||(p&&isDoc(p)),dt=is(/^#doi-tac/),lh=is(/^#lien-he/),info=is(/^#(gioi-thieu|thong-tin)/);
  document.body.classList.toggle("pdp",!!p);
  [["#navApp",app],["#navDv",svc],["#navTl",tl],["#navHoc",hoc],["#navDt",dt],["#navLh",lh]].forEach(([s,on])=>{$(s).classList.toggle("on",!!on);on?$(s).setAttribute("aria-current","page"):$(s).removeAttribute("aria-current")});
  p?product(p):a?article(a):pg?pageView(pg):t&&!/^#hoc-mien-phi/.test(h)?hocFolder(decodeURIComponent(t[1])):hoc?hocPage():info?infoPage():lh?contactPage():dt?partnerPage():is(/^#tai-lieu/)?docsPage():is(/^#dich-vu/)?servicesPage():is(/^#(app|san-pham)/)?appPage():home();bindZalo();window.scrollTo(0,0)}

      <p class="nho-chu">Trả lời từ ${esc(l.gio||MAC_DINH.gio)} hằng ngày.${ma.length?` Khi nhắn, anh chị ghi giúp mã ${ma.map(esc).join(", ")} để SONA biết anh chị quan tâm việc nào.`:""}</p></div>
    ${SITE.hotline||SITE.email||SITE.dia_chi?`<div class="kv">${SITE.hotline?`<div><span>Hotline</span><b>${esc(SITE.hotline)}</b></div>`:""}${SITE.email?`<div><span>Email</span><b>${esc(SITE.email)}</b></div>`:""}${SITE.dia_chi?`<div><span>Địa chỉ</span><b>${esc(SITE.dia_chi)}</b></div>`:""}</div>`:""}
    ${links.length?`<div class="mxh"><h3>Theo dõi SONA</h3><div class="vien-thuoc">${links.map(([n,u])=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(n)}</a>`).join("")}</div></div>`:""}
    <p class="rieng-tu">${esc(l.rieng_tu||MAC_DINH.rieng_tu)}</p>`)}</section>`}
/* ---------- Học kiến thức miễn phí (trước là "Học AI"): thư mục → bài. Giữ bài cũ, #hoc và /bai/<slug>/ vẫn chạy ---------- */
const postHit=words=>a=>{const hay=norm([a.tieu_de,a.tom_tat,a.chu_de,a.noi_dung].join(" "));return words.every(w=>hay.includes(w))};
const fmtDate=d=>{const m=String(d||"").match(/(\d{4})-(\d{2})-(\d{2})/);return m?m[3]+"/"+m[2]+"/"+m[1]:""};
const lessonCard=a=>`<a class="ls" href="#bai/${esc(a.slug)}"><span class="meta"><b>${esc(a.chu_de||"Kiến thức AI")}</b>· ${esc(fmtDate(a.ngay))} · ${esc(a.phut||3)} phút đọc</span><h3>${esc(a.tieu_de)}</h3><p>${esc(a.tom_tat)}</p></a>`;
const FOLDER_ORDER=["Bắt đầu","Viết nội dung","Chăm khách","Bán hàng","Quản lý tiệm"];
const folders=()=>{const m={};POSTS.forEach(a=>{const k=a.chu_de||"Kiến thức AI";(m[k]=m[k]||[]).push(a)});return Object.entries(m).sort((a,b)=>(FOLDER_ORDER.indexOf(a[0])+99)%99-(FOLDER_ORDER.indexOf(b[0])+99)%99)};
function hocPage(){const H=HOC();setMeta((H.tieu_de||MAC_DINH.hoc_tieu_de)+" · "+(SITE.ten_web||"SONA"),H.mo_ta||MAC_DINH.hoc_mo_ta);
  $("#app").innerHTML=W(`<section class="hoc-hero"><span class="free">Miễn phí</span><h1>${esc(H.tieu_de||MAC_DINH.hoc_tieu_de)}</h1><p>${esc(H.mo_ta||MAC_DINH.hoc_mo_ta)}</p></section>
  <div class="search" id="hbox" style="max-width:none">${ICON.search}<input id="hq" type="search" enterkeyhint="search" autocomplete="off" placeholder="Tìm bài học..." aria-label="Tìm bài học"><button class="clr" id="hclr" aria-label="Xóa tìm kiếm">×</button></div>
  <div class="folders" id="folders"></div>`);
  const q=$("#hq");const draw=()=>{const words=norm(q.value).split(/\s+/).filter(Boolean);$("#hbox").classList.toggle("has",!!q.value);
    if(words.length){const list=POSTS.filter(postHit(words));$("#folders").className="lessons";$("#folders").innerHTML=list.length?list.map(lessonCard).join(""):`<div class="empty"><b>Chưa có bài phù hợp</b>Anh chị thử từ khóa khác.</div>`;return}
    $("#folders").className="folders";const F=folders();
    $("#folders").innerHTML=F.length?F.map(([k,ls])=>`<a class="folder" href="#hoc/${encodeURIComponent(k)}">${ICON.folder}<span><b>${esc(k)}</b><small>${ls.length} bài</small></span><i>${ICON.arrow}</i></a>`).join(""):`<div class="empty"><b>Bài học đầu tiên sắp lên</b></div>`};
  q.oninput=draw;q.onkeydown=e=>{if(e.key==="Enter")q.blur()};$("#hclr").onclick=()=>{q.value="";q.focus();draw()};draw()}
function hocFolder(k){const ls=POSTS.filter(a=>(a.chu_de||"Kiến thức AI")===k);document.title=k+" · Học miễn phí";
  $("#app").innerHTML=W(`<a class="back" href="#hoc">← Học kiến thức miễn phí</a><section class="hoc-hero" style="padding-top:var(--khoang-5)"><h1>${esc(k)}</h1><p>${ls.length} bài</p></section><div class="lessons">${ls.map(lessonCard).join("")||`<div class="empty"><b>Thư mục này chưa có bài</b></div>`}</div>`)}
const safeUrl=u=>/^(https:\/\/|img\/|#)[^\s"'<>]*$/.test(u)&&!u.includes("..");
function md(src){const inl=t=>esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(m,x,u)=>safeUrl(u)?`<a href="${u}"${/^https/.test(u)?' target="_blank" rel="noopener"':""}>${x}</a>`:m);const out=[];let ul=null;
  String(src||"").split(/\n/).forEach(l=>{const t=l.trim();
    if(/^- /.test(t)){if(!ul){ul=[];out.push(ul)}ul.push("<li>"+inl(t.slice(2))+"</li>");return}ul=null;
    if(!t)return;const im=t.match(/^!\[([^\]]*)\]\(([^)\s]+)\)$/);if(im&&safeUrl(im[2])){out.push(`<img src="${esc(im[2])}" alt="${esc(im[1])}" loading="lazy">`);return}
    if(/^## /.test(t))out.push("<h2>"+inl(t.slice(3))+"</h2>");
    else if(/^> /.test(t)){const raw=t.slice(2);out.push(`<blockquote><button class="cp" data-cp="${esc(raw)}">Chép</button><p>${inl(raw)}</p></blockquote>`)}
    else out.push("<p>"+inl(t)+"</p>")});
  return out.map(x=>Array.isArray(x)?"<ul>"+x.join("")+"</ul>":x).join("")}
function article(a){setMeta((a.seo_tieu_de||a.tieu_de)+" · "+(SITE.ten_web||"SONA"),a.seo_mo_ta||a.tom_tat);const sp=a.sp&&PRODUCTS.find(p=>p.slug===a.sp);
  $("#app").innerHTML=W(`<article class="art"><a class="back" href="#hoc">← Học kiến thức miễn phí</a>
  <div class="meta"><span class="free">Miễn phí</span><span>${esc(a.chu_de||"")}</span><span>${esc(fmtDate(a.ngay))}</span><span>${esc(a.phut||3)} phút đọc</span></div>
  <h1>${esc(a.tieu_de)}</h1>${a.anh?`<div class="cover"><img src="${esc(a.anh)}" alt="${esc(a.tieu_de)}"></div>`:""}${a.viec?`<div class="lamngay"><b>Làm ngay 1 việc</b><p>${esc(a.viec)}</p></div>`:""}<div class="body">${md(a.noi_dung)}</div>
  ${sp?`<div class="cta"><b>Muốn có công cụ làm sẵn?</b><p>${esc(sp.ten)}</p><a class="btn" href="#sp/${esc(sp.slug)}">Xem sản phẩm ${ICON.arrow}</a></div>`:""}
  </article>`);document.querySelectorAll("[data-cp]").forEach(b=>b.onclick=()=>copy(b.dataset.cp))}
/* ---------- trang riêng tạo trong Admin ---------- */
function pageView(pg){setMeta((pg.seo_tieu_de||pg.tieu_de)+" · "+(SITE.ten_web||"SONA"),pg.seo_mo_ta);
  $("#app").innerHTML=W(`<article class="art" style="padding-top:var(--khoang-8)"><h1>${esc(pg.tieu_de)}</h1>${pg.anh?`<div class="cover"><img src="${esc(pg.anh)}" alt="${esc(pg.tieu_de)}"></div>`:""}<div class="body">${md(pg.noi_dung)}</div></article>`);
  document.querySelectorAll("[data-cp]").forEach(b=>b.onclick=()=>copy(b.dataset.cp))}
/* ---------- menu điện thoại, đổi sáng/tối, viền menu khi cuộn ---------- */
const mo=$("#moMenu"),bang=$("#bangMenu");
function closeMenu(){bang.classList.remove("mo");mo.setAttribute("aria-expanded","false");const w=document.getElementById("navDvWrap");if(w){w.classList.remove("mo");$("#navDv").setAttribute("aria-expanded","false")}}
mo.onclick=()=>{const m=bang.classList.toggle("mo");mo.setAttribute("aria-expanded",m)};
$("#navDv").onclick=()=>{const w=$("#navDvWrap"),m=w.classList.toggle("mo");$("#navDv").setAttribute("aria-expanded",m)};
addEventListener("click",e=>{if(!e.target.closest("#navDvWrap")){$("#navDvWrap").classList.remove("mo");$("#navDv").setAttribute("aria-expanded","false")}});
$("#doiNen").onclick=()=>{const r=document.documentElement,cur=r.getAttribute("data-theme");const dark=cur==="dark"||(!cur&&matchMedia("(prefers-color-scheme: dark)").matches);const nx=dark?"light":"dark";r.setAttribute("data-theme",nx);try{localStorage.setItem("sona-nen",nx)}catch(e){}};
addEventListener("scroll",()=>$("#menu").classList.toggle("da-cuon",scrollY>8),{passive:true});
addEventListener("keydown",e=>{if(e.key==="Escape")closeMenu()});
addEventListener("hashchange",route);load();
</script></body></html>
