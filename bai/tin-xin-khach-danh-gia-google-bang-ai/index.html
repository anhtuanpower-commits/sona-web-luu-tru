<style>
/* =====================================================================
   BIẾN THIẾT KẾ (design tokens). Đổi giao diện: chỉ sửa khối :root này.
   --mau-*   màu      --chu-*  kiểu chữ, cỡ chữ
   --bo-goc-* bo góc  --khoang-* khoảng cách  --bong-* đổ bóng
   ===================================================================== */
:root{
  --mau-nen:#07070a;           /* nền trang */
  --mau-be-mat:#111014;        /* nền thẻ, hộp */
  --mau-be-mat-2:#19171c;      /* nền phụ trong thẻ */
  --mau-vien:#2b2620;          /* viền */
  --mau-chu:#f6f1e7;           /* chữ chính */
  --mau-chu-phu:#a8a095;       /* chữ phụ */
  --mau-nhan:#d9b26f;          /* màu nhấn (vàng champagne) */
  --mau-nhan-sang:#f1dcae;     /* nhấn sáng */
  --mau-nhan-dam:#a9843f;      /* nhấn đậm */
  --mau-nhan-nen:#d9b26f1a;    /* nền nhạt của màu nhấn */
  --mau-chu-tren-nhan:#1a1206; /* chữ trên nút màu nhấn */
  --mau-dau-trang:#07070ad9;   /* nền thanh đầu trang (có trong suốt) */
  --chu-than:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --chu-tieu-de:var(--chu-than);
  --chu-co-nho:13px;
  --chu-co-than:15px;
  --chu-co-lon:17px;
  --chu-co-h3:17px;
  --chu-co-h2:clamp(21px,3.2vw,28px);
  --chu-co-h1:clamp(28px,5.4vw,48px);
  --chu-dam-tieu-de:700;
  --chu-dong:1.7;
  --bo-goc-nho:10px;
  --bo-goc:16px;
  --bo-goc-lon:24px;
  --bo-goc-nut:999px;
  --khoang-trang:16px;         /* lề hai bên */
  --khoang-khoi:72px;          /* khoảng giữa các khối lớn */
  --rong-toi-da:1120px;
  --rong-doc:760px;
  --bong:0 10px 30px #0006;
  --nut-nen:linear-gradient(180deg,var(--mau-nhan-sang),var(--mau-nhan) 55%,var(--mau-nhan-dam));
}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--mau-nen);color:var(--mau-chu);font-family:var(--chu-than);font-size:var(--chu-co-than);line-height:var(--chu-dong);overflow-x:hidden}
a{color:inherit;text-decoration:none}button{font-family:inherit}img{max-width:100%}
h1,h2,h3{font-family:var(--chu-tieu-de);font-weight:var(--chu-dam-tieu-de);letter-spacing:-.015em;margin:0}
.wrap{max-width:var(--rong-toi-da);margin:auto;padding:0 var(--khoang-trang)}
.doc{max-width:var(--rong-doc);margin:auto}
.muted{color:var(--mau-chu-phu)}
/* ---------- đầu trang ---------- */
header{position:sticky;top:0;z-index:20;background:var(--mau-dau-trang);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--mau-vien)}
.bar{display:flex;align-items:center;gap:12px;min-height:60px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:.12em}
.mark{width:34px;height:34px;border-radius:var(--bo-goc-nho);display:block}
.word{color:var(--mau-nhan-sang)}
.nav{display:flex;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none;max-width:100%}
.nav::-webkit-scrollbar{display:none}
.nav a{white-space:nowrap;padding:8px 12px;border-radius:var(--bo-goc-nut);font-size:14px;font-weight:600;color:var(--mau-chu-phu)}
.nav a.on,.nav a:hover{color:var(--mau-nhan-sang);background:var(--mau-nhan-nen)}
.nav a.cta-nav{color:var(--mau-chu-tren-nhan);background:var(--nut-nen)}
@media(max-width:600px){.bar{padding:8px 0 0;gap:4px}.nav{margin:0;padding:0 0 8px;width:100%;max-width:100%;box-sizing:border-box}.nav a{padding:7px 11px}}
/* ---------- nút ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:var(--bo-goc-nut);padding:13px 24px;font-size:15px;font-weight:600;color:var(--mau-chu-tren-nhan);background:var(--nut-nen);cursor:pointer;white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn.phu{background:transparent;color:var(--mau-chu);border:1px solid var(--mau-vien)}
.btn.phu:hover{border-color:var(--mau-nhan)}
.btn.rong{width:100%}
.btns{display:flex;flex-wrap:wrap;gap:10px}
/* ---------- khối chung ---------- */
.sec{padding:var(--khoang-khoi) 0 0}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.sec-h h2{font-size:var(--chu-co-h2);line-height:1.3}
.sec-h p{margin:6px 0 0;color:var(--mau-chu-phu);max-width:620px}
.sec-h a{color:var(--mau-nhan);font-weight:600}
.kicker{display:inline-block;font-size:var(--chu-co-nho);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mau-nhan);margin-bottom:8px}
.box{background:var(--mau-be-mat);border:1px solid var(--mau-vien);border-radius:var(--bo-goc);padding:22px}
.box h3{font-size:var(--chu-co-h3);margin-bottom:6px}
.box p{margin:0;color:var(--mau-chu-phu)}
.grid2,.grid3,.grid4{display:grid;gap:14px}
@media(min-width:700px){.grid2{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:repeat(3,1fr)}.grid4{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1000px){.grid4{grid-template-columns:repeat(4,1fr)}}
.ico{width:40px;height:40px;border-radius:var(--bo-goc-nho);display:grid;place-items:center;background:var(--mau-nhan-nen);color:var(--mau-nhan);margin-bottom:14px}
.ico svg{width:20px;height:20px}
/* ---------- trang chủ ---------- */
.hero{padding:64px 0 8px;text-align:center}
.hero h1{font-size:var(--chu-co-h1);line-height:1.2;max-width:820px;margin:0 auto 18px}
.hero .lead{margin:0 auto 28px;max-width:640px;color:var(--mau-chu-phu);font-size:var(--chu-co-lon)}
.hero .btns{justify-content:center}
.banner{display:block;width:100%;max-width:820px;margin:0 auto 28px;border-radius:var(--bo-goc-lon);border:1px solid var(--mau-vien);aspect-ratio:16/7;object-fit:cover}
.band{margin-top:var(--khoang-khoi);background:var(--mau-be-mat);border:1px solid var(--mau-vien);border-radius:var(--bo-goc-lon);padding:40px 24px;text-align:center}
.band h2{font-size:var(--chu-co-h2);margin-bottom:8px}.band p{margin:0 auto 22px;color:var(--mau-chu-phu);max-width:560px}.band .btns{justify-content:center}
/* ---------- thẻ sản phẩm ---------- */
.cards{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:700px){.cards{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1000px){.cards{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--mau-be-mat);border:1px solid var(--mau-vien);border-radius:var(--bo-goc);overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s}
.card:hover{border-color:var(--mau-nhan)}
.thumb{aspect-ratio:16/9;position:relative;display:grid;place-items:center;background:var(--mau-be-mat-2);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb svg{width:44px;height:44px;color:var(--mau-nhan)}
.card .in{padding:18px 20px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.tag{display:inline-block;align-self:flex-start;font-size:12px;font-weight:600;color:var(--mau-nhan);background:var(--mau-nhan-nen);border-radius:var(--bo-goc-nut);padding:3px 10px}
.card h3{font-size:var(--chu-co-h3);line-height:1.4}
.card p{margin:0;color:var(--mau-chu-phu);font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .more{margin-top:auto;padding-top:8px;color:var(--mau-nhan);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.card .more svg{width:16px;height:16px}
.empty{text-align:center;color:var(--mau-chu-phu);padding:40px 16px}
.empty b{display:block;color:var(--mau-chu);margin-bottom:6px}
/* ---------- trang Sản phẩm: tìm, lọc ---------- */
.page-h{padding:48px 0 8px}
.page-h h1{font-size:var(--chu-co-h1);line-height:1.2;margin-bottom:10px}
.page-h p{margin:0;color:var(--mau-chu-phu);max-width:640px;font-size:var(--chu-co-lon)}
.search{position:relative;max-width:560px;margin:22px 0 0}
.search svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--mau-chu-phu);pointer-events:none}
.search input{width:100%;height:50px;border-radius:var(--bo-goc-nut);border:1px solid var(--mau-vien);background:var(--mau-be-mat);color:var(--mau-chu);font:inherit;font-size:16px;padding:0 48px 0 50px;outline:none;-webkit-appearance:none;appearance:none}
.search input:focus{border-color:var(--mau-nhan)}
.search input::-webkit-search-cancel-button{display:none}
.search .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;border-radius:50%;background:var(--mau-be-mat-2);color:var(--mau-chu-phu);font-size:18px;cursor:pointer;display:none}
.search.has .clr{display:block}
.cats{display:flex;gap:8px;overflow-x:auto;padding:16px 0 20px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;border:1px solid var(--mau-vien);background:transparent;color:var(--mau-chu-phu);border-radius:var(--bo-goc-nut);padding:8px 16px;font-size:14px;font-weight:600;cursor:pointer}
.cat.on{background:var(--nut-nen);border-color:transparent;color:var(--mau-chu-tren-nhan)}
.cats[hidden],.search[hidden]{display:none}
/* ---------- trang chi tiết sản phẩm (khung chung) ---------- */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--mau-chu-phu);font-size:14px;padding:20px 0 0}
.pd-top{padding:28px 0 0;max-width:820px}
.pd-top h1{font-size:var(--chu-co-h1);line-height:1.2;margin:12px 0 14px}
.pd-top .lead{margin:0 0 20px;color:var(--mau-chu-phu);font-size:var(--chu-co-lon)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 24px;padding:0;list-style:none}
.chips li{display:inline-flex;align-items:center;gap:6px;font-size:14px;border:1px solid var(--mau-vien);border-radius:var(--bo-goc-nut);padding:6px 12px}
.chips svg{width:16px;height:16px;color:var(--mau-nhan);flex:none}
.cover{border-radius:var(--bo-goc-lon);overflow:hidden;border:1px solid var(--mau-vien);aspect-ratio:16/9;background:var(--mau-be-mat);margin-top:32px}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.pains{list-style:none;margin:0;padding:0;display:grid;gap:12px}
@media(min-width:700px){.pains{grid-template-columns:repeat(2,1fr)}}
.pains li{display:flex;gap:12px;align-items:flex-start;background:var(--mau-be-mat);border:1px solid var(--mau-vien);border-radius:var(--bo-goc);padding:16px 18px}
.pains li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--mau-nhan);margin-top:9px}
.feat .box{height:100%}
.ticks{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.ticks li{display:flex;gap:10px;align-items:flex-start}
.ticks li svg{flex:none;width:20px;height:20px;margin-top:3px;color:var(--mau-nhan)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.gal img{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:var(--bo-goc);border:1px solid var(--mau-vien);display:block;background:var(--mau-be-mat)}
.note{border:1px dashed var(--mau-vien);border-radius:var(--bo-goc);padding:22px;color:var(--mau-chu-phu);text-align:center}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:14px;counter-reset:s}
.steps li{display:flex;gap:14px;counter-increment:s;align-items:flex-start}
.steps li::before{content:counter(s);flex:none;width:30px;height:30px;border-radius:50%;background:var(--mau-nhan-nen);display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--mau-nhan)}
.faq details{border-top:1px solid var(--mau-vien)}.faq details:first-child{border-top:0}
.faq summary{cursor:pointer;list-style:none;padding:16px 32px 16px 0;font-weight:600;position:relative}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";position:absolute;right:4px;top:13px;font-size:20px;color:var(--mau-chu-phu)}
.faq details[open] summary::after{content:"–"}
.faq details p{margin:0 0 16px;color:var(--mau-chu-phu)}
.sticky{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:10px var(--khoang-trang) calc(10px + env(safe-area-inset-bottom));background:var(--mau-dau-trang);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--mau-vien);display:flex;align-items:center;gap:12px}
.sticky b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
@media(min-width:860px){.sticky{display:none}}
body.pdp footer{padding-bottom:96px}@media(min-width:860px){body.pdp footer{padding-bottom:30px}}
/* ---------- Học AI (giữ nguyên chức năng) ---------- */
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr));gap:14px;padding:16px 0 40px}
.ls{background:var(--mau-be-mat);border:1px solid var(--mau-vien);border-radius:var(--bo-goc);padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.ls:hover{border-color:var(--mau-nhan)}
.ls .meta{font-size:13px;color:var(--mau-chu-phu);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ls .meta b{color:var(--mau-nhan);font-weight:600}
.ls h3{font-size:16px;line-height:1.5;font-weight:600}.ls p{margin:0;color:var(--mau-chu-phu);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.folders{display:grid;gap:10px;padding:18px 0 40px}
.folder{display:flex;align-items:center;gap:14px;background:var(--mau-be-mat);border:1px solid var(--mau-vien);border-radius:var(--bo-goc);padding:16px 18px}
.folder:hover{border-color:var(--mau-nhan)}.folder>svg{width:28px;height:28px;color:var(--mau-nhan);flex:none}
.folder span{flex:1;display:flex;flex-direction:column}.folder b{font-size:16px;font-weight:600}.folder small{color:var(--mau-chu-phu)}.folder i svg{width:18px;height:18px;color:var(--mau-chu-phu)}
.free{display:inline-block;font-size:12px;font-weight:700;color:var(--mau-chu-tren-nhan);background:var(--nut-nen);border-radius:var(--bo-goc-nut);padding:2px 9px}
.hoc-hero{padding:40px 0 6px}.hoc-hero h1{margin:8px 0;font-size:var(--chu-co-h2);line-height:1.35}.hoc-hero p{margin:0;color:var(--mau-chu-phu)}
.lamngay{border:1px solid var(--mau-nhan);background:var(--mau-nhan-nen);border-radius:var(--bo-goc);padding:12px 14px;margin:6px 0 18px}.lamngay b{color:var(--mau-nhan);font-size:13px;letter-spacing:.04em;text-transform:uppercase}.lamngay p{margin:4px 0 0;font-weight:600}
.art{max-width:var(--rong-doc);margin:0 auto;padding-bottom:60px}
.art h1{font-size:var(--chu-co-h2);line-height:1.4;margin:12px 0}
.art .meta{color:var(--mau-chu-phu);font-size:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.body{font-size:16px;line-height:1.85;margin-top:20px;overflow-wrap:anywhere}
.body h2{font-size:19px;font-weight:600;margin:32px 0 12px}
.body blockquote{margin:14px 0;padding:14px 16px;border-left:3px solid var(--mau-nhan);background:var(--mau-be-mat);border-radius:var(--bo-goc-nho);position:relative}
.body blockquote .cp{position:absolute;right:10px;top:8px}
.body blockquote p{margin:0;padding-right:44px}
.body ul{padding-left:20px}.body li{margin:6px 0}
.body img{max-width:100%;border-radius:var(--bo-goc);border:1px solid var(--mau-vien);display:block;margin:16px 0}.body a{color:var(--mau-nhan);text-decoration:underline}
.art .cover{margin:0 0 14px}
.cp{border:0;background:transparent;color:var(--mau-nhan);font-weight:600;font-size:14px;cursor:pointer;padding:4px 0 4px 6px}
.cta{margin-top:30px;background:var(--mau-be-mat);border:1px solid var(--mau-vien);border-radius:var(--bo-goc);padding:20px;display:grid;gap:10px;justify-items:start}
.cta p{margin:0;color:var(--mau-chu-phu)}
/* ---------- giới thiệu, liên hệ ---------- */
.kv{display:grid;gap:8px}
.kv div{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--mau-be-mat-2);border-radius:var(--bo-goc-nho);padding:12px 14px}
.kv span{color:var(--mau-chu-phu)}.kv b{margin-left:auto;text-align:right;overflow-wrap:anywhere}
.zcard{display:grid;gap:16px;align-items:center}
@media(min-width:700px){.zcard{grid-template-columns:1fr auto}}
.zcard .num{font-size:var(--chu-co-h2);font-weight:700;color:var(--mau-nhan-sang);letter-spacing:.02em}
/* ---------- chân trang ---------- */
footer{margin-top:var(--khoang-khoi);border-top:1px solid var(--mau-vien);color:var(--mau-chu-phu);font-size:14px;padding:32px 0 30px}
.fgrid{display:grid;gap:22px}
@media(min-width:760px){.fgrid{grid-template-columns:1.4fr 1fr 1fr}}
.fgrid b{display:block;color:var(--mau-chu);margin-bottom:8px}
.fgrid a{display:block;padding:3px 0}.fgrid a:hover{color:var(--mau-nhan-sang)}
.fcopy{margin-top:24px;font-size:13px}
/* ---------- khác ---------- */
.pv-bar{position:fixed;top:0;left:0;right:0;z-index:100;background:var(--mau-nhan);color:var(--mau-chu-tren-nhan);font-size:13px;font-weight:700;text-align:center;padding:4px 10px}
body.pv{padding-top:28px}body.pv header{top:28px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--mau-chu);color:var(--mau-nen);font-weight:600;border-radius:var(--bo-goc-nut);padding:10px 18px;z-index:60;display:none;max-width:calc(100% - 32px);text-align:center}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<header><div class="wrap bar"><a class="brand" href="#" id="brand" aria-label="SONA, về trang chủ"><img class="mark" src="img/mark-192.png" alt="" width="34" height="34"><span class="word" id="siteName">SONA</span></a>

<script>

const norm=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").toLowerCase();
const ICON={

  app:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="3"/><path d="M10.5 18.5h3"/></svg>',

const CATS=["App","Tài liệu","Dịch vụ"];
const catOf=p=>/app/i.test(p.loai||"")?"App":/dịch vụ|dich vu/i.test(p.loai||"")?"Dịch vụ":"Tài liệu";
const iconOf=p=>({App:ICON.app,"Dịch vụ":ICON.svc}[catOf(p)]||ICON.doc);
const lines=v=>Array.isArray(v)?v.filter(Boolean):String(v||"").split("\n").map(s=>s.trim()).filter(Boolean);
/* "Tiêu đề: mô tả" → [tiêu đề, mô tả] */
const splitTitle=s=>{const i=String(s).indexOf(":");return i>0&&i<60?[s.slice(0,i).trim(),s.slice(i+1).trim()]:["",String(s)]};
let SITE={},PRODUCTS=[],POSTS=[],PAGES=[],Q="",CAT="";
/* Xem trước từ trang Admin: dữ liệu chưa lưu nằm tạm trong máy, chỉ dùng khi mở với ?preview=1 */
const PREVIEW=/[?&]preview=1(&|$)/.test(location.search);
/* Chữ mặc định. Mọi chữ dưới đây đều sửa được trong Admin; để trống thì web dùng chữ này. */
const MAC_DINH={
  khau_hieu:"Công nghệ cho mọi người",

  cam_ket:["Trả một lần, không phí tháng: Mua một lần, không thu phí phần mềm hằng tháng.","Dữ liệu là của anh chị: App và dữ liệu nằm trong tài khoản Google của spa.","Cài cùng anh chị: SONA hướng dẫn cài từng bước qua gọi video, anh chị tự bấm cấp quyền.","Hỗ trợ qua Zalo: Vướng chỗ nào, anh chị nhắn Zalo SONA."],
  cach_mua:["Nhắn Zalo SONA, kể tiệm mình đang cần gì.","SONA tư vấn sản phẩm phù hợp và báo giá riêng cho anh chị.","Hẹn giờ, SONA cài đặt cùng anh chị và hỗ trợ qua Zalo."],
  lam_gi:"SONA (SoNa Software) làm phần mềm đơn giản cho chủ kinh doanh nhỏ ở Việt Nam. Sản phẩm đầu tiên là app quản lý spa: cài vào tài khoản Google của spa, dùng trên điện thoại, trả một lần, không phí tháng.",
  gia_tri:["Thấu hiểu khách hàng: Lắng nghe nhu cầu thực tế để làm sản phẩm giải quyết đúng vấn đề khách đang gặp.","Nhanh gọn – Tối ưu: Đơn giản hóa điều phức tạp, để sản phẩm dễ hiểu, dễ dùng.","Uy tín – Cam kết: Kinh doanh trung thực, cam kết đúng những gì đã hứa, minh bạch trong mọi giao dịch.","Hiệu quả – Tốc độ: Tập trung vào kết quả, làm đúng việc và đúng hạn.","Dữ liệu – Tri thức: Học hỏi không ngừng, cải tiến sản phẩm dựa trên dữ liệu và thực tế."],
  gio:"8h–20h",
  loi_moi:"Anh chị nhắn Zalo SONA để được tư vấn sản phẩm phù hợp và báo giá riêng."};
const TC=()=>SITE.trang_chu||{};const TT=()=>SITE.thong_tin||{};const LH=()=>SITE.lien_he||{};
const khauHieu=()=>SITE.khau_hieu||MAC_DINH.khau_hieu;
const pick=(v,d)=>{const l=lines(v);return l.length?l:d};
const logoSrc=()=>SITE.logo||"img/mark-192.png";
function setMeta(title,desc){document.title=title;const m=document.querySelector('meta[name="description"]');if(m&&desc)m.content=String(desc).slice(0, 300)}
const zaloUrl=()=>SITE.zalo?"https://zalo.me/"+String(SITE.zalo).replace(/\D/g,""):"";
function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",2200)}
async function copy(t){try{await navigator.clipboard.writeText(t);toast("Đã sao chép")}catch(e){toast("Giữ tay vào chữ để sao chép")}}
/* Nút Liên hệ: mở Zalo SONA, chép sẵn tin nhắn có mã sản phẩm để SONA biết khách hỏi gì. Đây là cách mua duy nhất (D-045). */
function contactBtn(label,p,cls=""){const u=zaloUrl();const msg=p?`${p.ma_zalo?p.ma_zalo+" – ":""}Em muốn tư vấn ${p.ten}`:"Em cần SONA tư vấn";
  return u?`<a class="btn ${cls}" href="${esc(u)}" target="_blank" rel="noopener" data-zalo="${esc(msg)}">${ICON.chat}${esc(label||"Liên hệ tư vấn")}</a>`:`<a class="btn ${cls}" href="#lien-he">${esc(label||"Liên hệ tư vấn")}</a>`}
function bindZalo(){document.querySelectorAll("[data-zalo]").forEach(a=>a.onclick=()=>{try{navigator.clipboard.writeText(a.dataset.zalo).then(()=>toast("Đã chép tin nhắn, dán vào Zalo để gửi SONA"),()=>{})}catch(e){}})}
async function load(){
  try{[SITE,PRODUCTS]=await Promise.all([fetch("site.json").then(r=>r.json()),fetch("products.json").then(r=>r.json())])}catch(e){SITE={};PRODUCTS=[]}
  try{POSTS=await fetch("posts.json",{cache:"no-cache"}).then(r=>r.json())}catch(e){POSTS=[]}
  try{PAGES=await fetch("pages.json",{cache:"no-cache"}).then(r=>r.ok?r.json():[])}catch(e){PAGES=[]}
  if(PREVIEW){try{const d=JSON.parse(localStorage.getItem("sona_xem_truoc"));if(d&&Date.now()-d.t<7200000){SITE=d.site||SITE;PRODUCTS=d.products||PRODUCTS;POSTS=d.posts||POSTS;PAGES=d.pages||PAGES}}catch(e){}
    document.body.classList.add("pv");const b=document.createElement("div");b.className="pv-bar";b.textContent="Bản xem trước · chưa lên web thật";document.body.prepend(b)}
  else{PRODUCTS=PRODUCTS.filter(p=>!p.an);POSTS=POSTS.filter(a=>a.trang_thai!=="nhap");PAGES=PAGES.filter(x=>x.trang_thai!=="nhap")}
  if(!Array.isArray(PRODUCTS))PRODUCTS=[];if(!Array.isArray(POSTS))POSTS=[];if(!Array.isArray(PAGES))PAGES=[];
  POSTS.sort((a,b)=>String(b.ngay).localeCompare(String(a.ngay)));
  const name=SITE.ten_web||"SONA";
  $("#siteName").textContent=name;$("#fName").textContent=name;$("#fSlogan").textContent=khauHieu();document.querySelectorAll(".mark").forEach(i=>i.src=logoSrc());
  if(SITE.favicon){const l=document.querySelector('link[rel="icon"]');if(l)l.href=SITE.favicon}
  $("#foot").textContent=SITE.chan_trang||"© "+name+" · "+khauHieu()+(SITE.email?" · "+SITE.email:"");
  $("#flinks").innerHTML=[["#san-pham","Sản phẩm"],["#hoc","Học AI"],["#gioi-thieu","Giới thiệu SONA"],["#lien-he","Liên hệ"]].map(([h,t])=>`<a href="${h}">${t}</a>`).join("")+PAGES.filter(x=>x.hien_chan_trang).map(x=>`<a href="#trang/${esc(x.slug)}">${esc(x.tieu_de)}</a>`).join("");
  const S=SITE.mang_xa_hoi||{};const okU=u=>/^https:\/\//.test(u||"");
  $("#fsoc").innerHTML=[SITE.hotline&&`<a href="tel:${esc(SITE.hotline.replace(/[^\d+]/g,""))}">Hotline ${esc(SITE.hotline)}</a>`,zaloUrl()&&`<a href="${zaloUrl()}" target="_blank" rel="noopener">Zalo ${esc(SITE.zalo)}</a>`,
    okU(S.facebook)&&`<a href="${esc(S.facebook)}" target="_blank" rel="noopener">Facebook</a>`,okU(S.tiktok)&&`<a href="${esc(S.tiktok)}" target="_blank" rel="noopener">TikTok</a>`,okU(S.youtube)&&`<a href="${esc(S.youtube)}" target="_blank" rel="noopener">YouTube</a>`].filter(Boolean).join("");
  route()}
function route(){const h=location.hash||(window.SONA_ROUTE?"#"+window.SONA_ROUTE:"");
  const pm=h.match(/^#trang\/([\w-]+)/);const pg=pm&&PAGES.find(x=>x.slug===pm[1]);
  const m=h.match(/^#sp\/([\w-]+)/);const p=m&&PRODUCTS.find(x=>x.slug===m[1]);
  const b=h.match(/^#bai\/([\w-]+)/);const a=b&&POSTS.find(x=>x.slug===b[1]);
  const t=h.match(/^#hoc\/(.+)$/);const hoc=/^#hoc/.test(h)||!!a;const info=/^#(gioi-thieu|thong-tin)/.test(h);const lh=/^#lien-he/.test(h);const sp=/^#san-pham/.test(h)||!!m;
  document.body.classList.toggle("pdp",!!p);$("#navHoc").classList.toggle("on",hoc);$("#navInfo").classList.toggle("on",info);$("#navSp").classList.toggle("on",sp);
  p?product(p):a?article(a):pg?pageView(pg):t?hocFolder(decodeURIComponent(t[1])):hoc?hocPage():info?infoPage():lh?contactPage():sp?productsPage():home();bindZalo();window.scrollTo(0,0)}
/* ---------- thẻ sản phẩm (dùng chung trang chủ và trang Sản phẩm) ---------- */
const card=p=>`<a class="card" href="#sp/${esc(p.slug)}"><div class="thumb">${p.anh_bia?`<img src="${esc(p.anh_bia)}" alt="${esc(p.ten)}" loading="lazy">`:iconOf(p)}</div>
  <div class="in"><span class="tag">${esc(p.nhan||catOf(p))}</span><h3>${esc(p.ten)}</h3><p>${esc(p.phu_de)}</p><span class="more">Xem chi tiết ${ICON.arrow}</span></div></a>`;
const boxes=(list,icons)=>list.map((x,i)=>{const[t,d]=splitTitle(x);return`<div class="box">${icons?`<span class="ico">${icons[i%icons.length]}</span>`:""}${t?`<h3>${esc(t)}</h3>`:""}<p>${esc(d)}</p></div>`}).join("");
const stepsHtml=l=>`<ol class="steps">${l.map(x=>`<li><span>${esc(x)}</span></li>`).join("")}</ol>`;
/* ---------- trang chủ ---------- */
function home(){const seo=SITE.seo||{},tc=TC();setMeta(seo.tieu_de||(SITE.ten_web||"SONA")+" · "+khauHieu(),seo.mo_ta);
  const feat=PRODUCTS.slice(0,3);const cm=pick(tc.cam_ket,MAC_DINH.cam_ket);const steps=pick(TT().cach_mua,MAC_DINH.cach_mua);
  $("#app").innerHTML=`<section class="hero">${tc.anh_banner?`<img class="banner" src="${esc(tc.anh_banner)}" alt="">`:""}<h1>${esc(khauHieu())}</h1><p class="lead">${esc(tc.mo_ta||MAC_DINH.mo_ta)}</p>
    <div class="btns"><a class="btn" href="${esc(tc.nut_link||"#san-pham")}"${/^https:/.test(tc.nut_link||"")?' target="_blank" rel="noopener"':""}>${esc(tc.nut_chu||"Xem sản phẩm")} ${ICON.arrow}</a>${contactBtn("Liên hệ tư vấn",null,"phu")}</div></section>
  <section class="sec"><div class="grid4">${boxes(cm,[ICON.once,ICON.shield,ICON.video,ICON.chat])}</div></section>
  <section class="sec"><div class="sec-h"><div><span class="kicker">Sản phẩm</span><h2>${esc(tc.tieu_de_goi_y||"Sản phẩm của SONA")}</h2></div><a href="#san-pham">Xem tất cả →</a></div>
    ${feat.length?`<div class="cards">${feat.map(card).join("")}</div>`:`<div class="empty"><b>Sản phẩm sắp ra mắt</b>Anh chị nhắn Zalo SONA để được tư vấn nhé.</div>`}</section>
  <section class="sec"><div class="grid2"><div><span class="kicker">Làm việc với SONA</span><div class="sec-h" style="margin-bottom:0"><h2>Bắt đầu trong ${steps.length} bước</h2></div><p class="muted">Không cần biết công nghệ. SONA đi cùng anh chị từ lúc tư vấn đến khi dùng được.</p></div><div class="box">${stepsHtml(steps)}</div></div></section>
  ${POSTS.length?`<section class="sec"><div class="sec-h"><div><span class="kicker">Học AI miễn phí</span><h2>Bài mới cho chủ tiệm</h2></div><a href="#hoc">Xem tất cả →</a></div><div class="lessons" style="padding:0">${POSTS.slice(0,3).map(lessonCard).join("")}</div></section>`:""}
  ${band()}`}
const band=(t,d,p)=>`<section class="band"><h2>${esc(t||"Anh chị cần tư vấn?")}</h2><p>${esc(d||LH().loi_moi||MAC_DINH.loi_moi)}</p><div class="btns">${contactBtn("Liên hệ qua Zalo",p)}</div></section>`;
/* ---------- trang Sản phẩm ---------- */
function productsPage(){const tc=TC();setMeta("Sản phẩm · "+(SITE.ten_web||"SONA"),"Sản phẩm của SONA: app quản lý spa trả một lần, không phí tháng.");
  $("#app").innerHTML=`<section class="page-h"><span class="kicker">Sản phẩm</span><h1>Sản phẩm của SONA</h1><p>Mỗi sản phẩm làm cho một việc cụ thể, dễ dùng, trả một lần. Bấm vào để xem tính năng và câu hỏi thường gặp.</p>
    <div class="search" id="sbox"${tc.an_o_tim?" hidden":""}>${ICON.search}<input id="q" type="search" enterkeyhint="search" autocomplete="off" placeholder="${esc(tc.o_tim||"Anh chị đang cần gì?")}" aria-label="Tìm sản phẩm"><button class="clr" id="clr" aria-label="Xóa tìm kiếm">×</button></div></section>
    <nav class="cats" id="cats" aria-label="Loại sản phẩm"${tc.an_loc_loai?" hidden":""}></nav><div class="cards" id="grid"></div>${band()}`;
  const q=$("#q");q.value=Q;$("#sbox").classList.toggle("has",!!Q);
  q.oninput=()=>{Q=q.value;$("#sbox").classList.toggle("has",!!Q);renderGrid()};q.onkeydown=e=>{if(e.key==="Enter")q.blur()};
  $("#clr").onclick=()=>{Q="";q.value="";$("#sbox").classList.remove("has");q.focus();renderGrid()};renderGrid()}
function renderGrid(){const words=norm(Q).split(/\s+/).filter(Boolean);
  const hit=p=>{const hay=norm([p.ten,p.phu_de,p.loai,p.nhan,p.cho_ai,...lines(p.loi_ich),...lines(p.van_de)].join(" "));return words.every(w=>hay.includes(w))};
  const have=CATS.filter(c=>PRODUCTS.some(p=>catOf(p)===c));
  $("#cats").innerHTML=have.length>1?`<button class="cat${CAT?"":" on"}" data-c="" aria-pressed="${!CAT}">Tất cả</button>`+have.map(k=>`<button class="cat${CAT===k?" on":""}" data-c="${esc(k)}" aria-pressed="${CAT===k}">${esc(k)}</button>`).join(""):"";
  document.querySelectorAll(".cat").forEach(b=>b.onclick=()=>{CAT=b.dataset.c;renderGrid()});
  const list=PRODUCTS.filter(hit).filter(p=>!CAT||catOf(p)===CAT);
  $("#grid").innerHTML=list.length?list.map(card).join(""):`<div class="empty" style="grid-column:1/-1"><b>${words.length?"Chưa có sản phẩm phù hợp":"Sản phẩm sắp ra mắt"}</b>${words.length?"Anh chị thử từ khóa khác.":"Anh chị nhắn Zalo SONA để được tư vấn nhé."}</div>`}
/* ---------- trang chi tiết sản phẩm: một khung chung cho mọi sản phẩm ----------
   Lấy dữ liệu từ products.json: nhan, ten, phu_de, diem_nhan, anh_bia, van_de, loi_ich,
   anh_minh_hoa, cho_ai, cach_nhan, cam_ket, noi_dung, cau_hoi, nut, ma_zalo. Mục nào trống thì ẩn. */
function product(p){setMeta((p.seo_tieu_de||p.ten)+" · "+(SITE.ten_web||"SONA"),p.seo_mo_ta||p.phu_de);
  const vd=lines(p.van_de),li=lines(p.loi_ich),ca=lines(p.cho_ai),cn=lines(p.cach_nhan),dn=lines(p.diem_nhan),im=lines(p.anh_minh_hoa),qa=(p.cau_hoi||[]).filter(q=>q&&q.hoi);
  const nut=p.nut||"Liên hệ tư vấn";
  $("#app").innerHTML=`<a class="back" href="#san-pham">← Tất cả sản phẩm</a>
  <section class="pd-top"><span class="tag">${esc(p.nhan||catOf(p))}</span><h1>${esc(p.ten)}</h1>${p.phu_de?`<p class="lead">${esc(p.phu_de)}</p>`:""}
    ${dn.length?`<ul class="chips">${dn.map(x=>`<li>${ICON.check}${esc(x)}</li>`).join("")}</ul>`:""}
    <div class="btns">${contactBtn(nut,p)}${li.length?`<a class="btn phu" href="#tinh-nang" data-jump>Xem tính năng</a>`:""}</div></section>
  ${p.anh_bia?`<div class="cover"><img src="${esc(p.anh_bia)}" alt="${esc(p.ten)}"></div>`:""}
  ${vd.length?`<section class="sec" id="van-de"><div class="sec-h"><div><span class="kicker">Vấn đề</span><h2>Những việc ${esc(p.ten)} giúp anh chị gỡ</h2></div></div><ul class="pains">${vd.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></section>`:""}
  ${li.length?`<section class="sec feat" id="tinh-nang"><div class="sec-h"><div><span class="kicker">Tính năng chính</span><h2>Có gì trong ${esc(p.ten)}</h2></div></div><div class="grid3">${boxes(li)}</div></section>`:""}
  <section class="sec" id="anh-man-hinh"><div class="sec-h"><div><span class="kicker">Ảnh màn hình</span><h2>Giao diện app</h2></div></div>
    ${im.length?`<div class="gal">${im.map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="Ảnh màn hình ${esc(p.ten)} (dữ liệu mẫu)" loading="lazy"></a>`).join("")}</div><p class="muted" style="font-size:13px;margin:10px 0 0">Ảnh chụp với dữ liệu mẫu.</p>`
      :`<div class="note">Ảnh màn hình đang được cập nhật. Anh chị nhắn Zalo SONA để được xem trước.</div>`}</section>
  ${ca.length?`<section class="sec" id="danh-cho-ai"><div class="grid2"><div><span class="kicker">Dành cho ai</span><div class="sec-h" style="margin-bottom:0"><h2>Phù hợp với tiệm nào</h2></div></div><div class="box"><ul class="ticks">${ca.map(x=>`<li>${ICON.check}<span>${esc(x)}</span></li>`).join("")}</ul></div></div></section>`:""}
  ${cn.length||p.cam_ket?`<section class="sec" id="bat-dau"><div class="grid2"><div><span class="kicker">Cách bắt đầu</span><div class="sec-h" style="margin-bottom:0"><h2>Từ lúc liên hệ đến khi dùng</h2></div>${p.cam_ket?`<p class="muted">${esc(p.cam_ket)}</p>`:""}</div>${cn.length?`<div class="box">${cn.length>1?stepsHtml(cn):`<p>${esc(cn[0])}</p>`}</div>`:""}</div></section>`:""}
  ${p.noi_dung?`<section class="sec"><div class="doc body">${md(p.noi_dung)}</div></section>`:""}
  ${qa.length?`<section class="sec" id="hoi-dap"><div class="sec-h"><div><span class="kicker">Hỏi đáp</span><h2>Câu hỏi thường gặp</h2></div></div><div class="box faq">${qa.map(q=>`<details><summary>${esc(q.hoi)}</summary><p>${esc(q.dap)}</p></details>`).join("")}</div></section>`:""}
  ${band("Quan tâm "+p.ten+"?","SONA tư vấn và báo giá riêng qua Zalo. Anh chị bấm nút dưới để nhắn SONA.",p)}
  <div class="sticky"><b>${esc(p.ten)}</b>${contactBtn("Liên hệ",p)}</div>`;
  document.querySelectorAll("[data-jump]").forEach(a=>a.onclick=e=>{e.preventDefault();document.getElementById("tinh-nang")?.scrollIntoView({behavior:"smooth"})});
  document.querySelectorAll("#app [data-cp]").forEach(b=>b.onclick=()=>copy(b.dataset.cp))}
/* ---------- Giới thiệu SONA ---------- */
function infoPage(){const t=TT();setMeta("Giới thiệu · "+(SITE.ten_web||"SONA"),t.lam_gi||MAC_DINH.lam_gi);
  const gt=pick(t.gia_tri,MAC_DINH.gia_tri),steps=pick(t.cach_mua,MAC_DINH.cach_mua);
  $("#app").innerHTML=`<section class="page-h"><span class="kicker">Giới thiệu</span><h1>${esc(SITE.ten_web||"SONA")} · ${esc(khauHieu())}</h1><p>${esc(t.lam_gi||MAC_DINH.lam_gi)}</p></section>
  <section class="sec"><div class="sec-h"><div><span class="kicker">Giá trị cốt lõi</span><h2>SONA làm việc theo ${gt.length} giá trị</h2></div></div><div class="grid3">${boxes(gt)}</div></section>
  <section class="sec"><div class="grid2"><div><span class="kicker">Cách làm việc</span><div class="sec-h" style="margin-bottom:0"><h2>Mua và dùng sản phẩm SONA</h2></div><p class="muted">Mọi sản phẩm đều mua qua tư vấn trên Zalo. SONA báo giá riêng cho từng tiệm.</p></div><div class="box">${stepsHtml(steps)}</div></div></section>
  ${band()}`}
/* ---------- Liên hệ ---------- */
function contactPage(){const l=LH(),S=SITE.mang_xa_hoi||{};setMeta("Liên hệ · "+(SITE.ten_web||"SONA"),l.loi_moi||MAC_DINH.loi_moi);
  const links=[["Facebook",S.facebook],["TikTok",S.tiktok],["YouTube",S.youtube]].filter(x=>/^https:\/\//.test(x[1]||""));
  $("#app").innerHTML=`<section class="page-h"><span class="kicker">Liên hệ</span><h1>Nói chuyện với SONA</h1><p>${esc(l.loi_moi||MAC_DINH.loi_moi)}</p></section>
  <section class="sec" style="padding-top:32px"><div class="box zcard"><div><span class="kicker">Zalo SONA</span><div class="num">${esc(SITE.zalo||"")}</div><p class="muted" style="margin:4px 0 0">Trả lời tin nhắn ${esc(l.gio||MAC_DINH.gio)}</p></div>${contactBtn("Nhắn Zalo SONA")}</div></section>
  <section class="sec" style="padding-top:16px"><div class="grid2"><div class="box"><h3>Thông tin liên hệ</h3><div class="kv" style="margin-top:12px">${SITE.zalo?`<div><span>Zalo</span><b>${esc(SITE.zalo)}</b></div>`:""}${SITE.hotline?`<div><span>Hotline</span><b>${esc(SITE.hotline)}</b></div>`:""}${SITE.email?`<div><span>Email</span><b>${esc(SITE.email)}</b></div>`:""}${SITE.dia_chi?`<div><span>Địa chỉ</span><b>${esc(SITE.dia_chi)}</b></div>`:""}</div></div>
    <div class="box"><h3>Theo dõi SONA</h3>${links.length?`<div class="btns" style="margin-top:12px">${links.map(([n,u])=>`<a class="btn phu" href="${esc(u)}" target="_blank" rel="noopener">${esc(n)}</a>`).join("")}</div>`:`<p>Đang cập nhật.</p>`}</div></div></section>`}
/* ---------- học AI miễn phí: thư mục → bài (giữ nguyên) ---------- */
const postHit=words=>a=>{const hay=norm([a.tieu_de,a.tom_tat,a.chu_de,a.noi_dung].join(" "));return words.every(w=>hay.includes(w))};
const fmtDate=d=>{const m=String(d||"").match(/(\d{4})-(\d{2})-(\d{2})/);return m?m[3]+"/"+m[2]+"/"+m[1]:""};
const lessonCard=a=>`<a class="ls" href="#bai/${esc(a.slug)}"><span class="meta"><b>${esc(a.chu_de||"Kiến thức AI")}</b>· ${esc(fmtDate(a.ngay))} · ${esc(a.phut||3)} phút đọc</span><h3>${esc(a.tieu_de)}</h3><p>${esc(a.tom_tat)}</p></a>`;
const FOLDER_ORDER=["Bắt đầu","Viết nội dung","Chăm khách","Bán hàng","Quản lý tiệm"];
const folders=()=>{const m={};POSTS.forEach(a=>{const k=a.chu_de||"Kiến thức AI";(m[k]=m[k]||[]).push(a)});return Object.entries(m).sort((a,b)=>(FOLDER_ORDER.indexOf(a[0])+99)%99-(FOLDER_ORDER.indexOf(b[0])+99)%99)};
function hocPage(){setMeta("Học AI miễn phí · "+(SITE.ten_web||"SONA"),"Bài học AI miễn phí cho người kinh doanh nhỏ, mỗi bài đọc khoảng 3 phút, làm được ngay.");
  $("#app").innerHTML=`<section class="hoc-hero"><span class="free">Miễn phí</span><h1>Học AI miễn phí</h1><p>Chọn một thư mục để xem bài. Mỗi bài đọc khoảng 3 phút, làm được ngay.</p></section>
  <div class="search" id="hbox" style="max-width:none">${ICON.search}<input id="hq" type="search" enterkeyhint="search" autocomplete="off" placeholder="Tìm bài học..." aria-label="Tìm bài học"><button class="clr" id="hclr" aria-label="Xóa tìm kiếm">×</button></div>
  <div class="folders" id="folders"></div>`;
  const q=$("#hq");const draw=()=>{const words=norm(q.value).split(/\s+/).filter(Boolean);$("#hbox").classList.toggle("has",!!q.value);
    if(words.length){const list=POSTS.filter(postHit(words));$("#folders").className="lessons";$("#folders").innerHTML=list.length?list.map(lessonCard).join(""):`<div class="empty" style="grid-column:1/-1"><b>Chưa có bài phù hợp</b>Anh chị thử từ khóa khác.</div>`;return}
    $("#folders").className="folders";const F=folders();
    $("#folders").innerHTML=F.length?F.map(([k,ls])=>`<a class="folder" href="#hoc/${encodeURIComponent(k)}">${ICON.folder}<span><b>${esc(k)}</b><small>${ls.length} bài</small></span><i>${ICON.arrow}</i></a>`).join(""):`<div class="empty"><b>Bài học đầu tiên sắp lên</b></div>`};
  q.oninput=draw;q.onkeydown=e=>{if(e.key==="Enter")q.blur()};$("#hclr").onclick=()=>{q.value="";q.focus();draw()};draw()}
function hocFolder(k){const ls=POSTS.filter(a=>(a.chu_de||"Kiến thức AI")===k);document.title=k+" · Học AI miễn phí";
  $("#app").innerHTML=`<a class="back" href="#hoc">← Học AI miễn phí</a><section class="hoc-hero" style="padding-top:10px"><h1>${esc(k)}</h1><p>${ls.length} bài</p></section><div class="lessons">${ls.map(lessonCard).join("")||`<div class="empty"><b>Thư mục này chưa có bài</b></div>`}</div>`}
const safeUrl=u=>/^(https:\/\/|img\/|#)[^\s"'<>]*$/.test(u)&&!u.includes("..");
function md(src){const inl=t=>esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(m,x,u)=>safeUrl(u)?`<a href="${u}"${/^https/.test(u)?' target="_blank" rel="noopener"':""}>${x}</a>`:m);const out=[];let ul=null;
  String(src||"").split(/\n/).forEach(l=>{const t=l.trim();
    if(/^- /.test(t)){if(!ul){ul=[];out.push(ul)}ul.push("<li>"+inl(t.slice(2))+"</li>");return}ul=null;
    if(!t)return;const im=t.match(/^!\[([^\]]*)\]\(([^)\s]+)\)$/);if(im&&safeUrl(im[2])){out.push(`<img src="${esc(im[2])}" alt="${esc(im[1])}" loading="lazy">`);return}
    if(/^## /.test(t))out.push("<h2>"+inl(t.slice(3))+"</h2>");
    else if(/^> /.test(t)){const raw=t.slice(2);out.push(`<blockquote><button class="cp" data-cp="${esc(raw)}">Chép</button><p>${inl(raw)}</p></blockquote>`)}
    else out.push("<p>"+inl(t)+"</p>")});
  return out.map(x=>Array.isArray(x)?"<ul>"+x.join("")+"</ul>":x).join("")}
function article(a){setMeta((a.seo_tieu_de||a.tieu_de)+" · "+(SITE.ten_web||"SONA"),a.seo_mo_ta||a.tom_tat);const sp=a.sp&&PRODUCTS.find(p=>p.slug===a.sp);
  $("#app").innerHTML=`<article class="art"><a class="back" href="#hoc">← Học AI miễn phí</a>
  <div class="meta" style="margin-top:16px"><span class="free">Miễn phí</span><span>${esc(a.chu_de||"")}</span><span>${esc(fmtDate(a.ngay))}</span><span>${esc(a.phut||3)} phút đọc</span></div>
  <h1>${esc(a.tieu_de)}</h1>${a.anh?`<div class="cover"><img src="${esc(a.anh)}" alt="${esc(a.tieu_de)}"></div>`:""}${a.viec?`<div class="lamngay"><b>Làm ngay 1 việc</b><p>${esc(a.viec)}</p></div>`:""}<div class="body">${md(a.noi_dung)}</div>
  ${sp?`<div class="cta"><b>Muốn có công cụ làm sẵn?</b><p>${esc(sp.ten)}</p><a class="btn" href="#sp/${esc(sp.slug)}">Xem sản phẩm ${ICON.arrow}</a></div>`:""}
  </article>`;document.querySelectorAll("[data-cp]").forEach(b=>b.onclick=()=>copy(b.dataset.cp))}
/* ---------- trang riêng tạo trong Admin ---------- */
function pageView(pg){setMeta((pg.seo_tieu_de||pg.tieu_de)+" · "+(SITE.ten_web||"SONA"),pg.seo_mo_ta);
  $("#app").innerHTML=`<article class="art" style="padding-top:32px"><h1>${esc(pg.tieu_de)}</h1>${pg.anh?`<div class="cover"><img src="${esc(pg.anh)}" alt="${esc(pg.tieu_de)}"></div>`:""}<div class="body">${md(pg.noi_dung)}</div></article>`;
  document.querySelectorAll("[data-cp]").forEach(b=>b.onclick=()=>copy(b.dataset.cp))}
addEventListener("hashchange",route);load();
</script></body></html>
